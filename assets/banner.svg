<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#818cf8;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for glowing ambience -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .metric-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #f1f5f9;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Glows (Background Layer) -->
  <g filter="url(#blurFilter)" opacity="0.6">
    <!-- Blue/Cyan Orb -->
    <circle cx="200" cy="120" r="140" fill="url(#glowCyan)">
      <animate attributeName="cx" values="200;260;180;200" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;180;100;120" dur="12s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;170;130;140" dur="12s" repeatCount="indefinite" />
    </circle>
    <!-- Violet/Pink Orb -->
    <circle cx="1000" cy="280" r="160" fill="url(#glowViolet)">
      <animate attributeName="cx" values="1000;940;1040;1000" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;220;300;280" dur="14s" repeatCount="indefinite" />
      <animate attributeName="r" values="160;190;150;160" dur="14s" repeatCount="indefinite" />
    </circle>
    <!-- Center Soft Accent Orb -->
    <circle cx="600" cy="200" r="100" fill="#0ea5e9" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Subtle Animated Connecting Network Nodes (Behind Text) -->
  <g opacity="0.28">
    <line x1="80" y1="90" x2="220" y2="60" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="220" y1="60" x2="380" y2="100" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="80" x2="1140" y2="140" stroke="#c084fc" stroke-dasharray="4 4" stroke-width="1.5">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="6s" repeatCount="indefinite" />
    </line>
    <circle cx="80" cy="90" r="4" fill="#38bdf8" />
    <circle cx="220" cy="60" r="5" fill="#818cf8" />
    <circle cx="380" cy="100" r="4" fill="#38bdf8" />
    <circle cx="1020" cy="80" r="4" fill="#c084fc" />
    <circle cx="1140" cy="140" r="5" fill="#f472b6" />
  </g>

  <!-- Foreground Content (Solid, Clear, Prominent) -->
  <!-- Header Badge Pill -->
  <g transform="translate(600, 75)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-140" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-122" y="5" class="pill-text" fill="#38bdf8">CURATED AWESOME REPOSITORY</text>
    <text x="96" y="5" class="pill-text" fill="#94a3b8">• 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" class="title-text" fill="url(#textGrad)">Awesome Digital Workplace Portal</text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" class="subtitle-text">The Complete Directory of Enterprise Intranets, Communications Hubs &amp; Self-Hosted Workspaces</text>

  <!-- Feature Tags / Category Cards in Foreground -->
  <g transform="translate(140, 275)">
    <!-- Pill 1: SaaS Intranets -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="46" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="22" y="28" font-size="18">🏢</text>
      <text x="50" y="28" class="metric-title" fill="#e2e8f0">SaaS Platforms</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <text x="22" y="28" font-size="18">🔓</text>
      <text x="50" y="28" class="metric-title" fill="#e2e8f0">Open Source Portals</text>
    </g>

    <!-- Pill 3: Employee Experience -->
    <g transform="translate(485, 0)">
      <rect x="0" y="0" width="215" height="46" rx="23" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="22" y="28" font-size="18">💬</text>
      <text x="50" y="28" class="metric-title" fill="#e2e8f0">Internal Comms</text>
    </g>

    <!-- Pill 4: Knowledge Hub -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="200" height="46" rx="23" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity="0.95" />
      <text x="22" y="28" font-size="18">📚</text>
      <text x="50" y="28" class="metric-title" fill="#e2e8f0">Knowledge Bases</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(600, 370)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" font-weight="500">
      ⚡ Transparent Pricing • 🎯 Free Tier Limitations • 📊 Company Valuation Benchmarks • 🌟 Star Metrics
    </text>
  </g>

  <!-- Outer Sleek Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="15.25" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
